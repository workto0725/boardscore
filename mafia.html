<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모두의 보드점수+ · 마피아</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#eafff7;background:#10231e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0d1c20,#173529);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:18px}.panel{background:#1c3832;border:1px solid #3f665b;border-radius:18px;padding:19px;margin:15px 0;box-shadow:0 8px 25px #0002}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:0 0 14px}.muted{color:#b2ccc1;font-size:13px;line-height:1.7}.btn{border:1px solid #668f81;background:#274c41;color:#f0fff9;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer;min-height:44px}.primary{background:#82e2bf;color:#082921;border:0}.danger{background:#754046}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions .btn{flex:1}input{width:100%;border-radius:11px;background:#102620;border:1px solid #648378;color:white;padding:13px;font-size:16px;margin:8px 0 14px}.hidden{display:none!important}.person{border:1px solid #4b7265;padding:11px 13px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:12px}.role{padding:24px;text-align:center;border:2px solid #9eeac9;border-radius:15px;margin:12px 0;font-size:28px;font-weight:800}.role.mafia{background:#462b34;color:#ffb9bf;border-color:#aa6574}.role.citizen{background:#204939;color:#bbffe1}.notice{padding:12px;border-radius:10px;background:#244e42;margin:10px 0}.vote{width:100%;text-align:left;margin:5px 0}.vote:disabled{opacity:.5}.status{position:sticky;top:0;background:#10231ef5;z-index:3;padding:10px 18px;border-bottom:1px solid #44675a;text-align:center}.link{color:#8af4cc;text-decoration:none}#err{color:#ffb8b8;min-height:20px;font-weight:700}#qr{background:white;width:max-content;margin:14px auto;padding:10px;border-radius:10px}</style></head><body><div class="status">🎭 모두의 보드점수+ · 사회자 없는 마피아</div><main class="wrap"><a class="link" href="./">← 보드점수 홈</a><section class="panel" id="entry"><h1>🎭 마피아게임</h1><p class="muted">각자 휴대폰으로 들어와 자기 역할만 확인하세요. 앱이 밤과 낮, 투표를 진행합니다. 최소 4명, 최대 16명.</p><label>게임에서 사용할 이름<input id="nickname" maxlength="24" placeholder="이름 또는 별명" autocomplete="nickname"></label><div class="actions"><button class="btn primary" onclick="enter('create')">＋ 새 방 만들기</button><button class="btn" onclick="enter('join')">QR 방 참가하기</button></div><div id="joinFields" class="hidden"><label>방 코드<input id="roomCode" placeholder="방 링크를 열었다면 자동 입력됩니다"></label><button class="btn primary" onclick="enter('join')">방 참가</button></div></section><section class="panel hidden" id="game"><h2 id="heading">대기 중</h2><p id="hint" class="muted"></p><div id="qrArea" class="hidden"><p class="muted">친구에게 아래 QR 또는 링크를 보내세요.</p><div id="qr"></div><div class="actions"><button class="btn" onclick="shareInvite()">🔗 초대 링크 공유</button></div><p class="muted" id="inviteText"></p></div><div id="roleBox" class="hidden"></div><div id="players"></div><div id="choices"></div><div id="actions"></div><p class="muted">상태는 약 3초마다 자동 갱신돼요. 각자 역할은 본인 화면에만 표시됩니다.</p></section><p id="err"></p></main><script>
const sb='https://peejfdyoteapxqeoopym.supabase.co',key='sb_publishable_1grOApiItDSaer3ExIhLzA_3e0KAEzU';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
let room=new URLSearchParams(location.search).get('room'),token=null,view=null,busy=false;
const storageKey=()=>room?'mafia-player-'+room:'';
async function api(action,target=null,name=null){const response=await fetch(sb+'/rest/v1/rpc/mafia_action',{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({p_room:room,p_player:token,p_action:action,p_name:name,p_target:target})});const data=await response.json();if(!response.ok)throw Error(data.message||'서버 연결 오류');return data}
function showError(e){$('err').textContent=e.message||String(e);setTimeout(()=>$('err').textContent='',6500)}
async function enter(action){if(busy)return;const name=$('nickname').value.trim();if(!name){showError(Error('이름을 입력해 주세요'));return}if(action==='join'&&!room){$('joinFields').classList.remove('hidden');room=$('roomCode').value.trim();if(!/^[0-9a-f-]{36}$/i.test(room))return}if(action==='create')room=crypto.randomUUID();token=crypto.randomUUID();busy=true;try{view=await api(action,null,name);localStorage.setItem(storageKey(),token);localStorage.setItem('mafia-name',name);history.replaceState(null,'','?room='+room);$('entry').classList.add('hidden');$('game').classList.remove('hidden');render();}catch(e){showError(e)}finally{busy=false}}
function invite(){return location.origin+location.pathname+'?room='+encodeURIComponent(room)}
async function shareInvite(){const link=invite();try{if(navigator.share)await navigator.share({title:'마피아게임 초대',url:link});else await navigator.clipboard.writeText(link)}catch(e){if(e.name!=='AbortError')prompt('링크를 복사하세요',link)}}
async function doAction(action,target){if(busy)return;busy=true;try{view=await api(action,target);render()}catch(e){showError(e)}finally{busy=false}}
function render(){if(!view)return;const p=view.players||[],phase=view.phase;const titles={lobby:'참가자를 기다리는 중',night:view.round+'번째 밤',day:view.round+'번째 낮',finished:'게임 종료'};$('heading').textContent=titles[phase]||'마피아';const role=view.role;$('hint').textContent=phase==='lobby'?'모두 모이면 방장이 시작해요.':phase==='night'?'모두 눈을 감으세요. 마피아는 제거할 대상을 선택합니다.':phase==='day'?'누가 마피아인지 서로 이야기한 뒤 각자 한 명에게 투표하세요.':'게임이 끝났습니다.';$('qrArea').classList.toggle('hidden',phase!=='lobby');if(phase==='lobby'){$('inviteText').textContent=invite();$('qr').innerHTML='';if(typeof QRCode==='function')new QRCode($('qr'),{text:invite(),width:180,height:180})}
$('roleBox').classList.toggle('hidden',phase==='lobby');if(phase!=='lobby')$('roleBox').innerHTML='<div class="role '+(role==='mafia'?'mafia':'citizen')+'">'+(role==='mafia'?'🔪 당신은 마피아':'🕊️ 당신은 시민')+'</div>'+(view.alive?'':'<p class="notice">탈락했습니다. 투표할 수 없어요.</p>');
$('players').innerHTML='<h2>참가자 '+p.length+'명</h2>'+p.map(x=>'<div class="person"><span>'+esc(x.name)+(x.id===view.myId?' (나)':'')+'</span><span>'+(x.alive?'참가 중':'탈락')+(phase==='day'&&x.voted?' · 투표함':'')+(phase==='finished'?' · '+(x.role==='mafia'?'마피아':'시민'):'')+'</span></div>').join('');
let eligible=phase==='day'&&view.alive||phase==='night'&&view.alive&&role==='mafia';
$('choices').innerHTML=eligible?'<h2>'+(phase==='night'?'밤: 제거할 시민':'낮: 마피아로 의심되는 사람')+' 선택</h2>'+(view.voted?'<p class="notice">선택 완료! 다른 사람의 선택을 기다려요. (다시 선택하면 변경됩니다.)</p>':'')+p.filter(x=>x.alive&&x.id!==view.myId).map(x=>'<button class="btn vote" onclick="doAction(\'vote\',\''+x.id+'\')">'+esc(x.name)+' 선택</button>').join(''):'';
$('actions').innerHTML=phase==='lobby'?(view.host?'<button class="btn primary" onclick="doAction(\'start\')">🎭 게임 시작 (4명 이상)</button>':'<p class="notice">방장이 시작하면 내 역할이 표시됩니다.</p>'):'';
if(phase==='finished')$('actions').innerHTML='<div class="notice"><strong>'+(view.winner==='mafia'?'🔪 마피아 승리!':'🕊️ 시민 승리!')+'</strong></div><a class="btn link" href="./mafia.html">새 방 만들기</a>';
}
async function sync(){if(!token||!room||busy)return;try{view=await api('state');render()}catch(e){showError(e)}}
(async()=>{const name=localStorage.getItem('mafia-name');if(name)$('nickname').value=name;if(room){token=localStorage.getItem(storageKey());if(token){try{view=await api('state');$('entry').classList.add('hidden');$('game').classList.remove('hidden');render()}catch(e){token=null}}else{$('joinFields').classList.remove('hidden')}}setInterval(sync,3000)})();
</script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></body></html>
