name: BoardScore Plus Android build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run web regression checks
        run: node tests/release-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm /111 | head -n 1)"
          test -n "$MANAGER"
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          "$MANAGER" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK and unsigned AAB with diagnostic log
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease 2>&1 | tee build-output.log
      - name: Upload build log even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardscoreplus-build-log
          path: android/build-output.log
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boardscoreplus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boardscoreplus-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish latest debug APK as prerelease
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p public-apk
          cp "$APK" public-apk/boardscoreplus-debug.apk
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --title "모두의 보드점수+ 테스트 APK" --notes "테스트용 앱입니다. Google Play 정식 출시 전 검증용 APK이며 자동 빌드 때 갱신됩니다." --prerelease
          fi
          gh release upload debug-latest public-apk/boardscoreplus-debug.apk --clobber
