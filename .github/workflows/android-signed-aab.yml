name: BoardScore Plus signed Play AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - '.github/workflows/android-signed-aab.yml'
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify score app regression checks
        run: node tests/release-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm /111 | head -n 1)"
          test -n "$MANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
      - name: Install Android 36 SDK
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify signing credentials exist
        shell: bash
        env:
          KS_B64: ${{ secrets.BOARDSCORE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BOARDSCORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOARDSCORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOARDSCORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" && test -n "$KS_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || {
            echo "::error::Configure four BOARDSCORE_ signing secrets before running this workflow"
            exit 1
          }
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          test -s "$RUNNER_TEMP/upload-key.jks"
      - name: Build unsigned release bundle
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease
      - name: Sign AAB with upload key
        shell: bash
        env:
          KS_PASS: ${{ secrets.BOARDSCORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOARDSCORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOARDSCORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/upload-key.jks" -storepass:env KS_PASS -keypass:env KEY_PASS -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -q "SHA256:"
          mkdir -p signed-output
          cp "$AAB" signed-output/boardscoreplus-play-upload.aab
      - name: Upload signed Play Store bundle privately
        uses: actions/upload-artifact@v4
        with:
          name: boardscoreplus-play-upload-aab
          path: signed-output/boardscoreplus-play-upload.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
